apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: main
  namespace: monitoring-system
spec:
  selectAllByDefault: false

  userSelector:
    matchLabels:
      vmauth: main

  userNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring-system

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: vmagent-writer
  namespace: monitoring-system
  labels:
    vmauth: main
spec:
  username: vmagent-writer
  passwordRef:
    name: vm-writer-credentials
    key: password

  targetRefs:
    - crd:
        kind: VMSingle
        name: main
        namespace: monitoring-system
      paths:
        - "/api/v1/write"

---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: grafana-reader
  namespace: monitoring-system
  labels:
    vmauth: main
spec:
  username: grafana-reader
  passwordRef:
    name: vm-reader-credentials
    key: password

  targetRefs:
    - crd:
        kind: VMSingle
        name: main
        namespace: monitoring-system
      paths:
        - "/api/v1/query"
        - "/api/v1/query_range"
        - "/api/v1/series"
        - "/api/v1/labels"
        - "/api/v1/label/.*"
        - "/api/v1/metadata"
        - "/api/v1/status/.*"