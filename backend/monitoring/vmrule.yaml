apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: always-firing
  namespace: monitoring-system
  labels:
    alerting: main
spec:
  groups:
    - name: test-alerts
      interval: 10s
      rules:
        - alert: AlwaysFiring
          expr: vector(1)
          labels:
            severity: warning
          annotations:
            summary: "Always-firing test alert"
            description: "This alert verifies the complete alerting pipeline."