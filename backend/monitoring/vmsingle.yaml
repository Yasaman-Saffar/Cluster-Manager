apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: main
  namespace: monitoring-system
spec:
  retentionPeriod: "7d"

  storage:
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 15Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1.5Gi